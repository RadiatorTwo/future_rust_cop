[package]
name = "fcop"
version = "0.1.0"
edition = "2024"
description = "Future Cop: L.A.P.D. (1998) recompiled to native code with Cranelift"
license = "MIT"

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reference emulator for the differential test only (GPL-2.0: never linked into the game)
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"], optional = true }

[features]
difftest = ["dep:unicorn-engine"]

[[bin]]
name = "difftest"
required-features = ["difftest"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
# assembling test snippets
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info", "code_asm"] }
