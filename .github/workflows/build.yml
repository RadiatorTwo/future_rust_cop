name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "fcop-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/fcop.exe, README.md, LICENSE $name
          Copy-Item -Recurse dist/game_files $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: fcop-windows-x64
          path: ${{ env.ZIP }}
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
